[package]
name = "w7bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Windows의 등록된 프로젝트 명령을 실행하는 MCP 서버"
license = "MIT"
repository = "https://github.com/bimoraa/w7bridge"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
fs2 = "0.4"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "process-group"] }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "server", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
toml = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
